<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Teatro de Sombras</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* El lienzo se mantiene en 16:9 y se ajusta a la ventana sin deformarse */
    canvas {
      width: min(100vw, calc(100vh * 16 / 9)) !important;
      height: auto !important;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <script src="sketch.js"></script>
</body>

</html>
